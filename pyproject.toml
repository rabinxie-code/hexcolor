[project]
name = "hexbench"
version = "0.1.0"
description = "Reference implementations and benchmarks for 100B crop-level HEX annotation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "Pillow>=11.0",
  "scikit-image>=0.25",
  "cffi>=1.17",
  "imagequant==1.1.5",
  "setuptools>=68",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.7",
  "triton>=3.3",
  "nvidia-nvimgcodec-cu12>=0.9",
]

[tool.ruff]
line-length = 120

[tool.pyright]
include = ["hexbench", "scripts", "tests"]
